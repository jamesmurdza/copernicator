<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copernicator — CSS Orbits</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="menu" role="region" aria-label="Controls">
      <form id="controls">
        <fieldset>
          <legend>Center on</legend>
          <label><input type="radio" name="planet" value="sun" checked /> Sun</label>
          <label><input type="radio" name="planet" value="mercury" /> Mercury</label>
          <label><input type="radio" name="planet" value="venus" /> Venus</label>
          <label><input type="radio" name="planet" value="earth" /> Earth</label>
          <label><input type="radio" name="planet" value="mars" /> Mars</label>
          <label><input type="radio" name="planet" value="jupiter" /> Jupiter</label>
          <label><input type="radio" name="planet" value="saturn" /> Saturn</label>
        </fieldset>
        <fieldset>
          <legend>Zoom</legend>
          <label><input type="radio" name="zoom" value="0.8" /> 0.8×</label>
          <label><input type="radio" name="zoom" value="1.0" checked /> 1.0×</label>
          <label><input type="radio" name="zoom" value="1.6" /> 1.6×</label>
        </fieldset>
      </form>
    </div>

    <div class="viewport" id="viewport" role="region" aria-label="Solar system viewport">
      <div id="system">
        <!-- Central star -->
        <div class="planet sun" data-planet="sun" aria-label="Sun"></div>

        <!-- Orbits -->
        <div class="orbit" style="--r: calc(var(--unit) * 0.39)"></div>
        <div class="orbit" style="--r: calc(var(--unit) * 0.72)"></div>
        <div class="orbit" style="--r: calc(var(--unit) * 1)"></div>
        <div class="orbit" style="--r: calc(var(--unit) * 1.52)"></div>
        <div class="orbit" style="--r: calc(var(--unit) * 5.2)"></div>
        <div class="orbit" style="--r: calc(var(--unit) * 9.54)"></div>

        <!-- Mercury -->
        <div class="orbiter" style="--duration: calc(var(--earth-period) * 0.24)">
          <div class="carrier" style="--r: calc(var(--unit) * 0.39)">
            <div class="planet mercury" data-planet="mercury" aria-label="Mercury"></div>
          </div>
        </div>
        <!-- Venus -->
        <div class="orbiter" style="--duration: calc(var(--earth-period) * 0.62)">
          <div class="carrier" style="--r: calc(var(--unit) * 0.72)">
            <div class="planet venus" data-planet="venus" aria-label="Venus"></div>
          </div>
        </div>
        <!-- Earth -->
        <div class="orbiter" style="--duration: calc(var(--earth-period) * 1)">
          <div class="carrier" style="--r: calc(var(--unit) * 1)">
            <div class="planet earth" data-planet="earth" aria-label="Earth"></div>
          </div>
        </div>
        <!-- Mars -->
        <div class="orbiter" style="--duration: calc(var(--earth-period) * 1.88)">
          <div class="carrier" style="--r: calc(var(--unit) * 1.52)">
            <div class="planet mars" data-planet="mars" aria-label="Mars"></div>
          </div>
        </div>
        <!-- Jupiter -->
        <div class="orbiter" style="--duration: calc(var(--earth-period) * 11.86)">
          <div class="carrier" style="--r: calc(var(--unit) * 5.2)">
            <div class="planet jupiter" data-planet="jupiter" aria-label="Jupiter"></div>
          </div>
        </div>
        <!-- Saturn -->
        <div class="orbiter" style="--duration: calc(var(--earth-period) * 29.46)">
          <div class="carrier" style="--r: calc(var(--unit) * 9.54)">
            <div class="planet saturn" data-planet="saturn" aria-label="Saturn"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (() => {
        const viewport = document.getElementById('viewport');
        const system = document.getElementById('system');
        const planetInputs = Array.from(document.querySelectorAll('input[name="planet"]'));
        const zoomInputs = Array.from(document.querySelectorAll('input[name="zoom"]'));

        let selectedPlanet = 'sun';
        let zoomValue = 1;

        function updateSelected() {
          const p = planetInputs.find(i => i.checked);
          selectedPlanet = p ? p.value : 'sun';
        }

        function updateZoom() {
          const z = zoomInputs.find(i => i.checked);
          zoomValue = z ? parseFloat(z.value) : 1;
          system.style.setProperty('--zoom', String(zoomValue));
        }

        planetInputs.forEach(i => i.addEventListener('change', updateSelected));
        zoomInputs.forEach(i => i.addEventListener('change', updateZoom));

        updateSelected();
        updateZoom();

        function loop() {
          const planetEl = system.querySelector(`[data-planet="${selectedPlanet}"]`);
          if (planetEl) {
            const vp = viewport.getBoundingClientRect();
            const pl = planetEl.getBoundingClientRect();
            const centerX = vp.left + vp.width / 2;
            const centerY = vp.top + vp.height / 2;
            const plX = pl.left + pl.width / 2;
            const plY = pl.top + pl.height / 2;
            const dx = plX - centerX;
            const dy = plY - centerY;
            const scale = zoomValue || 1;
            system.style.setProperty('--offset-x', `${-dx / scale}px`);
            system.style.setProperty('--offset-y', `${-dy / scale}px`);
          }
          requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
